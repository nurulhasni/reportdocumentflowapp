<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Track Sales Orders (Live Backend)</title>

	<style>
		html, body {
			height: 100%;
			margin: 0;
			padding: 0;
			overflow: hidden;
			background: #f7f9fa;
		}
		#loading-indicator {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: #f7f9fa;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			z-index: 99999;
			color: #32363a;
		}
		.spinner {
			width: 48px;
			height: 48px;
			border: 4px solid #d9e1e8;
			border-top: 4px solid #0070f2;
			border-radius: 50%;
			animation: spin 0.9s linear infinite;
			margin-bottom: 16px;
		}
		@keyframes spin {
			0% { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}
		#auth-card {
			display: none;
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			width: 360px;
			background: #ffffff;
			border-radius: 12px;
			box-shadow: 0 8px 32px rgba(0,0,0,0.18);
			padding: 28px 24px;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			z-index: 100001;
			text-align: left;
		}
		#auth-card h3 {
			margin: 0 0 4px 0;
			font-size: 18px;
			color: #1d2d3e;
		}
		#auth-card p {
			margin: 0 0 20px 0;
			font-size: 13px;
			color: #6a6d70;
		}
		.input-group {
			margin-bottom: 14px;
		}
		.input-group label {
			display: block;
			font-size: 12px;
			font-weight: 600;
			margin-bottom: 5px;
			color: #47536a;
		}
		.input-group input {
			width: 100%;
			box-sizing: border-box;
			padding: 9px 12px;
			border: 1px solid #bcc3ca;
			border-radius: 6px;
			font-size: 14px;
			outline: none;
			transition: border-color 0.2s;
		}
		.input-group input:focus {
			border-color: #0070f2;
		}
		.btn-login {
			width: 100%;
			padding: 10px 16px;
			background: #0070f2;
			color: #ffffff;
			border: none;
			border-radius: 6px;
			font-size: 14px;
			font-weight: 600;
			cursor: pointer;
			margin-top: 8px;
			transition: background 0.2s;
		}
		.btn-login:hover {
			background: #0056b3;
		}
		#auth-error {
			display: none;
			margin-top: 12px;
			padding: 8px 12px;
			background: #fff0f0;
			border: 1px solid #e03e3e;
			border-radius: 6px;
			color: #b00020;
			font-size: 12px;
		}
		#error-box {
			display: none;
			position: fixed;
			top: 20px;
			left: 20px;
			right: 20px;
			max-height: 80vh;
			overflow-y: auto;
			background: #fff0f0;
			border: 2px solid #e03e3e;
			border-radius: 8px;
			padding: 16px 20px;
			color: #b00020;
			font-family: monospace;
			font-size: 13px;
			z-index: 100000;
			box-shadow: 0 4px 16px rgba(0,0,0,0.15);
		}
	</style>

	<script type="text/javascript">
		window.onerror = function (msg, url, lineNo, columnNo, error) {
			var errBox = document.getElementById("error-box");
			if (errBox) {
				errBox.style.display = "block";
				errBox.innerHTML += "<b>[Error]</b> " + msg + "<br><small>" + url + ":" + lineNo + ":" + columnNo + "</small><br>" + (error && error.stack ? "<pre>" + error.stack + "</pre>" : "") + "<hr>";
			}
			return false;
		};

		// Mock/Stub UShell services for Fiori Elements template
		window.sap = window.sap || {};
		window.sap.ushell = window.sap.ushell || {};
		if (!window.sap.ushell.Container) {
			window.sap.ushell.Container = {
				getService: function (sService) {
					if (sService === "CrossApplicationNavigation") {
						return {
							toExternal: function (oArgs) { console.log("CrossAppNav toExternal:", oArgs); },
							getSemanticObjectLinks: function () { return jQuery.Deferred().resolve([]).promise(); },
							isNavigationSupported: function () { return jQuery.Deferred().resolve({ "SalesOrder-trackStatus": { supported: true } }).promise(); },
							hrefForExternal: function () { return "#"; }
						};
					}
					if (sService === "URLParsing") {
						return {
							parseShellHash: function () { return {}; },
							constructShellHash: function () { return ""; }
						};
					}
					return {
						getLinks: function () { return jQuery.Deferred().resolve([]).promise(); }
					};
				},
				getServiceAsync: function (sService) {
					return Promise.resolve(this.getService(sService));
				},
				getRenderer: function () {
					return null;
				}
			};
		}

		function startUI5Component() {
			var statusText = document.getElementById("loading-status");
			if (statusText) statusText.innerText = "Loading Track Sales Orders Component...";

			sap.ui.require([
				"sap/m/Shell",
				"sap/ui/core/ComponentContainer"
			], function (Shell, ComponentContainer) {
				try {
					var oContainer = new ComponentContainer({
						name: "cus.sd.sofulfil.trackstatuss1",
						height: "100%",
						settings: {
							id: "cus.sd.sofulfil.trackstatuss1"
						},
						manifest: true,
						async: true
					});

					new Shell({
						appWidthLimited: false,
						app: oContainer
					}).placeAt("content");

					setTimeout(function () {
						var loadInd = document.getElementById("loading-indicator");
						if (loadInd) loadInd.style.display = "none";
					}, 1500);

				} catch (e) {
					console.error("Component error:", e);
					var errBox = document.getElementById("error-box");
					if (errBox) {
						errBox.style.display = "block";
						errBox.innerHTML = "<b>Component Init Error:</b> " + e.message + "<pre>" + e.stack + "</pre>";
					}
					var loadInd = document.getElementById("loading-indicator");
					if (loadInd) loadInd.style.display = "none";
				}
			});
		}

		function checkBackendAuth() {
			var xhr = new XMLHttpRequest();
			xhr.open("GET", "/sap/opu/odata/sap/SD_SOFA/$metadata", true);
			xhr.onreadystatechange = function () {
				if (xhr.readyState === 4) {
					if (xhr.status === 200) {
						// Already authenticated!
						startUI5Component();
					} else if (xhr.status === 401) {
						// Needs SAP Login
						var loadInd = document.getElementById("loading-indicator");
						if (loadInd) loadInd.style.display = "none";
						var authCard = document.getElementById("auth-card");
						if (authCard) authCard.style.display = "block";
					} else {
						// Other status (server might still be reachable or error)
						startUI5Component();
					}
				}
			};
			xhr.onerror = function () {
				startUI5Component();
			};
			xhr.send();
		}

		window.submitSapLogin = function () {
			var u = document.getElementById("sap-user").value.trim();
			var p = document.getElementById("sap-pass").value;
			var errDiv = document.getElementById("auth-error");
			errDiv.style.display = "none";

			if (!u || !p) {
				errDiv.innerText = "Please enter username and password.";
				errDiv.style.display = "block";
				return;
			}

			var btn = document.getElementById("btn-submit");
			btn.innerText = "Authenticating...";
			btn.disabled = true;

			var xhr = new XMLHttpRequest();
			xhr.open("GET", "/sap/opu/odata/sap/SD_SOFA/$metadata", true);
			xhr.setRequestHeader("Authorization", "Basic " + btoa(u + ":" + p));
			xhr.onreadystatechange = function () {
				if (xhr.readyState === 4) {
					btn.innerText = "Login & Load App";
					btn.disabled = false;
					if (xhr.status === 200) {
						document.getElementById("auth-card").style.display = "none";
						var loadInd = document.getElementById("loading-indicator");
						if (loadInd) loadInd.style.display = "flex";
						startUI5Component();
					} else {
						errDiv.innerText = "Login failed (HTTP " + xhr.status + "). Please check your SAP credentials.";
						errDiv.style.display = "block";
					}
				}
			};
			xhr.send();
		};

		window.onUI5Init = function () {
			checkBackendAuth();
		};
	</script>

	<script
		id="sap-ui-bootstrap"
		src="https://ui5.sap.com/1.120.13/resources/sap-ui-core.js"
		data-sap-ui-theme="sap_horizon"
		data-sap-ui-compatVersion="edge"
		data-sap-ui-async="true"
		data-sap-ui-oninit="onUI5Init"
		data-sap-ui-resourceroots='{
			"cus.sd.sofulfil.trackstatuss1": "./",
			"cus.sd.lib.worklist": "./cus/sd/lib/worklist"
		}'
		data-sap-ui-libs="sap.m, sap.ui.generic.app, sap.suite.ui.generic.template, sap.ui.comp, sap.ui.layout, sap.ui.table"
		data-sap-ui-frameOptions="allow">
	</script>
</head>
<body class="sapUiBody" id="content">
	<div id="loading-indicator">
		<div class="spinner"></div>
		<h3 style="margin: 0 0 8px 0; font-weight: 600;">Track Sales Orders</h3>
		<p id="loading-status" style="margin: 0; color: #6a6d70; font-size: 14px;">Connecting to SAP backend...</p>
	</div>

	<div id="auth-card">
		<h3>SAP NetWeaver Login</h3>
		<p>Server: <code>s2025pst.pst.co.id:44305</code> (Client 110)</p>
		<div class="input-group">
			<label for="sap-user">SAP Username</label>
			<input type="text" id="sap-user" placeholder="e.g. USERNAME" autocomplete="username">
		</div>
		<div class="input-group">
			<label for="sap-pass">Password</label>
			<input type="password" id="sap-pass" placeholder="Enter password" autocomplete="current-password" onkeydown="if(event.key==='Enter') submitSapLogin()">
		</div>
		<button id="btn-submit" class="btn-login" onclick="submitSapLogin()">Login & Load App</button>
		<div id="auth-error"></div>
	</div>

	<div id="error-box"></div>
</body>
</html>
